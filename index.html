<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Watch Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cormorant Garamond for cinematic titles -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Geist for light, precise utility text -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    
    <style>
:root {
    --bg: #030303;
    --bg-elevated: #0a0a0a;
    --bg-hover: #111111;
    --text: #e3d1c1;
    --text-muted: #a38c7a;
    --border: #1a1a1a;
    --accent: #a87c51;
    
    --font-serif: 'Cormorant Garamond', serif;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    
    --nav-height: 100px;
    --mobile-nav-height: calc(80px + env(safe-area-inset-bottom));
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
}
::-webkit-scrollbar-track {
    background: var(--bg);
}
::-webkit-scrollbar-thumb {
    background: #3a322c;
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    border-radius: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--font-sans);
    font-weight: 300;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
}

::selection {
    background: #222;
    color: #fff;
}

/* Typography */
h1, h2, h3, h4, h5, h6, .serif {
    font-family: var(--font-serif);
    font-weight: 400;
    line-height: 1.1;
}

/* Utilities */
.hidden {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
}

.mobile-only {
    display: block;
}

@media (min-width: 768px) {
    .mobile-only {
        display: none !important;
    }
}

.fade-in {
    animation: fadeIn 1s cubic-bezier(0.2, 1, 0.3, 1) forwards;
}

@keyframes fadeIn {
    from { opacity: 0; filter: blur(10px); transform: translateY(20px); }
    to { opacity: 1; filter: blur(0); transform: translateY(0); }
}

/* Navigation - Desktop */
.desktop-nav {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    z-index: 100;
    padding: 0 5rem;
    background: linear-gradient(to bottom, rgba(3,3,3,0.9), transparent);
}

.desktop-nav .nav-left, .desktop-nav .nav-center, .desktop-nav .nav-right {
    display: flex;
    align-items: center;
}

.desktop-nav .nav-center {
    gap: 4rem;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.desktop-nav .nav-right {
    gap: 3rem;
    margin-left: auto;
}

.logo {
    font-family: var(--font-serif);
    font-size: 2rem;
    letter-spacing: 0.05em;
    font-style: italic;
}

.nav-link {
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    transition: color 0.4s ease;
}

.nav-link:hover, .nav-link.active {
    color: var(--text);
}

.nav-link.active {
    border-bottom: 1px solid var(--text);
    padding-bottom: 2px;
}

.utility-btn {
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    transition: color 0.4s ease;
}

.utility-btn:hover {
    color: var(--text);
}

/* Navigation - Mobile */
.mobile-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: var(--mobile-nav-height);
    background-color: rgba(3, 3, 3, 0.98);
    border-top: 1px solid var(--border);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
    justify-content: space-around;
    align-items: center;
}

.mobile-nav .nav-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    padding: 10px;
    border: none !important;
    transition: color 0.4s ease;
}

.mobile-nav .nav-link span {
    font-size: 0.65rem;
    letter-spacing: 0.05em;
}

.mobile-nav .nav-link.active {
    color: var(--text);
}

@media (min-width: 768px) {
    .desktop-nav { display: flex; align-items: center; }
    .mobile-nav { display: none; }
}

/* App Container */
#app {
    min-height: 100vh;
    padding-bottom: var(--mobile-nav-height);
    transition: opacity 0.6s cubic-bezier(0.2, 1, 0.3, 1), filter 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

@media (min-width: 768px) {
    #app { padding-bottom: 0; }
}

#app.navigating {
    opacity: 0;
    filter: blur(8px);
}

/* Hero Section */
.hero {
    position: relative;
    width: 100vw;
    height: 85vh;
    overflow: hidden;
}

@media (min-width: 768px) {
    .hero { height: 80vh; }
}

@media (min-width: 1024px) {
    .hero { height: 90vh; }
}

.hero-images {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    /* This creates the perfect dissolve into black at the bottom */
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
}

.hero-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    filter: blur(15px);
    transition: opacity 1.5s cubic-bezier(0.2, 1, 0.3, 1), filter 1.5s cubic-bezier(0.2, 1, 0.3, 1);
}

.hero-img.active {
    opacity: 1;
    filter: blur(0);
}

.hero-content {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 3;
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

@media (min-width: 768px) {
    .hero-content { padding: 6rem 5rem; }
}

.hero-title-container {
    position: relative;
    height: 100px;
    width: 100%;
    margin-bottom: 2rem;
}

@media (min-width: 768px) {
    .hero-title-container { height: 180px; }
}

.hero-title {
    position: absolute;
    bottom: 0;
    left: 0;
    font-size: 4rem;
    letter-spacing: -0.02em;
    opacity: 0;
    filter: blur(10px);
    transform: translateY(20px);
    transition: opacity 1s cubic-bezier(0.2, 1, 0.3, 1), filter 1s cubic-bezier(0.2, 1, 0.3, 1), transform 1s cubic-bezier(0.2, 1, 0.3, 1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}

@media (min-width: 768px) {
    .hero-title { font-size: 10rem; }
}

.hero-title.active {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
}

.hero-meta-container {
    position: relative;
    height: 20px;
    width: 100%;
    margin-bottom: 2rem;
}

.hero-meta {
    position: absolute;
    bottom: 0;
    left: 0;
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0;
    filter: blur(5px);
    transform: translateY(10px);
    transition: opacity 1s cubic-bezier(0.2, 1, 0.3, 1), filter 1s cubic-bezier(0.2, 1, 0.3, 1), transform 1s cubic-bezier(0.2, 1, 0.3, 1);
}

.hero-meta.active {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
}

.watch-btn {
    display: inline-block;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text);
    border-bottom: 1px solid var(--text);
    padding-bottom: 6px;
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.4s;
}

.watch-btn:hover {
    transform: translateX(10px);
    opacity: 0.8;
}

/* Sections */
.section {
    padding: 6rem 2rem;
    max-width: 1600px;
    margin: 0 auto;
}

@media (min-width: 768px) {
    .section { padding: 12rem 5rem; }
}

.section-header {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    margin-bottom: 4rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    color: var(--text-muted);
}

@media (min-width: 768px) {
    .section-header { font-size: 2rem; margin-bottom: 6rem; }
}

.section-header::after {
    content: '';
    flex-grow: 1;
    height: 1px;
    background-color: var(--border);
}

/* Video Grid */
.video-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 3rem;
}

@media (min-width: 768px) {
    .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6rem 4rem;
    }
}

@media (min-width: 1200px) {
    .video-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

.video-card {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 1rem;
    background: rgba(255, 255, 255, 0.02);
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), border-color 0.4s ease, background 0.4s ease;
}

.video-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.04);
}

.video-card-img-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background-color: var(--bg-elevated);
    overflow: hidden;
}

.video-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.6s;
}

.video-card:hover img {
    transform: scale(1.02);
}

.video-duration {
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--bg);
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
}

.video-card-info {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.video-card-title {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.4s;
}

.video-card:hover .video-card-title {
    color: var(--text-muted);
}

.video-card-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

/* Menu Overlay */
.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s cubic-bezier(0.2, 1, 0.3, 1), filter 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

.menu-overlay.hidden {
    opacity: 0;
    filter: blur(15px);
    pointer-events: none;
}

.close-menu {
    position: absolute;
    top: 3rem;
    right: 3rem;
    font-size: 1.5rem;
    color: var(--text-muted);
    transition: transform 0.4s, color 0.4s;
}

.close-menu:hover {
    transform: rotate(90deg);
    color: var(--text);
}

.menu-links {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
}

.menu-link {
    font-family: var(--font-serif);
    font-size: 3rem;
    transition: color 0.4s, transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
    font-style: italic;
}

@media (min-width: 768px) {
    .menu-link { font-size: 5rem; }
}

.menu-link:hover {
    color: var(--text-muted);
    transform: translateX(20px);
}

.menu-divider {
    width: 60px;
    height: 1px;
    background-color: var(--border);
    margin: 2rem 0;
}

/* Toast */
.toast {
    position: fixed;
    bottom: calc(var(--mobile-nav-height) + 2rem);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 1rem 3rem;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    z-index: 2000;
    transition: opacity 0.6s, transform 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

@media (min-width: 768px) {
    .toast { bottom: 4rem; }
}

.toast.hidden {
    opacity: 0;
    transform: translate(-50%, 40px);
    pointer-events: none;
}

/* Video Detail */
.detail-hero {
    position: relative;
    width: 100vw;
    height: 60vh;
}

@media (min-width: 768px) {
    .detail-hero { height: 80vh; }
}

.detail-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
}

.detail-content {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 2rem;
    position: relative;
    margin-top: -8rem;
    z-index: 10;
}

@media (min-width: 768px) {
    .detail-content { padding: 0 5rem; margin-top: -12rem; }
}

.detail-title {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 2rem;
    letter-spacing: -0.02em;
}

@media (min-width: 768px) {
    .detail-title { font-size: 8rem; margin-bottom: 3rem; }
}

.detail-meta-row {
    display: flex;
    gap: 2rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4rem;
}

@media (min-width: 768px) {
    .detail-meta-row { margin-bottom: 6rem; }
}

.detail-actions {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    margin-bottom: 6rem;
    align-items: flex-start;
}

@media (min-width: 768px) {
    .detail-actions { flex-direction: row; align-items: center; margin-bottom: 10rem; }
}

.detail-watch-btn {
    display: inline-block;
    padding: 1.5rem 4rem;
    background-color: var(--text);
    color: var(--bg);
    font-family: var(--font-serif);
    font-size: 1.5rem;
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), background-color 0.4s;
    font-style: italic;
}

.detail-watch-btn:hover {
    background-color: var(--text-muted);
    transform: translateY(-5px);
}

.detail-fav-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid transparent;
    padding-bottom: 4px;
    transition: color 0.4s, border-color 0.4s;
}

.detail-fav-btn:hover {
    color: var(--text);
    border-color: var(--text);
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4rem;
    border-top: 1px solid var(--border);
    padding-top: 4rem;
    margin-bottom: 6rem;
}

@media (min-width: 768px) {
    .detail-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 6rem; 
        padding-top: 6rem; 
        margin-bottom: 10rem; 
    }
}

.detail-col h3 {
    font-family: var(--font-serif);
    font-size: 2rem;
    color: var(--text-muted);
    margin-bottom: 3rem;
    font-style: italic;
}

.detail-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.detail-item {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
}

.detail-item-label {
    color: var(--text);
    font-size: 0.95rem;
}

.detail-item-sub {
    color: var(--text-muted);
    font-size: 0.85rem;
}

/* Search Page */
.search-container {
    padding: 6rem 2rem 2rem;
    max-width: 1600px;
    margin: 0 auto;
}

@media (min-width: 768px) {
    .search-container { padding: 8rem 5rem 2rem; }
}

.search-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: 2.5rem;
    padding: 1rem 0;
    transition: border-color 0.4s;
}

@media (min-width: 768px) {
    .search-input { font-size: 4rem; }
}

.search-input:focus {
    outline: none;
    border-color: var(--text);
}

.search-input::placeholder {
    color: var(--border);
}

.search-results-meta {
    margin: 4rem 0;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
}

/* Empty State */
.empty-state {
    padding: 10rem 0;
    text-align: center;
}

.empty-state h2 {
    font-size: 3rem;
    margin-bottom: 2rem;
    color: var(--text-muted);
    font-style: italic;
}

.empty-state p {
    color: var(--text-muted);
    font-size: 0.95rem;
}

/* Player Placeholder */
.player-placeholder {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
}

.player-placeholder h1 {
    font-size: 4rem;
    margin-bottom: 2rem;
    font-style: italic;
}

.player-placeholder p {
    color: var(--text-muted);
    margin-bottom: 4rem;
    font-size: 0.95rem;
}

.btn-clear {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--text);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: opacity 0.4s;
}

.btn-clear:hover {
    opacity: 0.6;
}

/* Loading Screen */
.loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg);
    z-index: 99999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 1.5s cubic-bezier(0.65, 0, 0.05, 1);
}

.loader.finished {
    transform: translateY(-100%);
}

.loader-word {
    display: flex;
    font-family: var(--font-serif);
    font-size: 5rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
}

@media (min-width: 768px) {
    .loader-word { font-size: 10rem; }
}

.loader-char {
    position: relative;
    display: inline-flex;
    overflow: hidden;
    padding: 0 0.1rem;
}

.loader-char .char {
    opacity: 0;
}

.loader-char .block {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--text);
    transform: scaleX(0);
    transform-origin: left;
}

@keyframes blockIn {
    0% { transform: scaleX(0); transform-origin: left; }
    49.9% { transform: scaleX(1); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
}

@keyframes charReveal {
    0%, 49.9% { opacity: 0; }
    50%, 100% { opacity: 1; }
}

.loader:not(.finished) .loader-char .block {
    animation: blockIn 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
}

.loader:not(.finished) .loader-char .char {
    animation: charReveal 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
}

/* Stagger animation */
.loader-char:nth-child(1) .block, .loader-char:nth-child(1) .char { animation-delay: 0.2s; }
.loader-char:nth-child(2) .block, .loader-char:nth-child(2) .char { animation-delay: 0.35s; }
.loader-char:nth-child(3) .block, .loader-char:nth-child(3) .char { animation-delay: 0.5s; }
.loader-char:nth-child(4) .block, .loader-char:nth-child(4) .char { animation-delay: 0.65s; }
.loader-char:nth-child(5) .block, .loader-char:nth-child(5) .char { animation-delay: 0.8s; }


@keyframes charHide {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

.loader.hiding .loader-char .block {
    animation: blockIn 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards !important;
}

.loader.hiding .loader-char .char {
    animation: charHide 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards !important;
}

/* Forward stagger for hiding (W disappears first) */

    background: rgba(255, 255, 255, 0.02);
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), border-color 0.4s ease, background 0.4s ease;
}

.video-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.04);
}

.video-card-img-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background-color: var(--bg-elevated);
    overflow: hidden;
}

.video-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.6s;
}

.video-card:hover img {
    transform: scale(1.02);
}

.video-duration {
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--bg);
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
}

.video-card-info {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.video-card-title {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.4s;
}

.video-card:hover .video-card-title {
    color: var(--text-muted);
}

.video-card-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

/* Menu Overlay */
.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s cubic-bezier(0.2, 1, 0.3, 1), filter 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

.menu-overlay.hidden {
    opacity: 0;
    filter: blur(15px);
    pointer-events: none;
}

.close-menu {
    position: absolute;
    top: 3rem;
    right: 3rem;
    font-size: 1.5rem;
    color: var(--text-muted);
    transition: transform 0.4s, color 0.4s;
}

.close-menu:hover {
    transform: rotate(90deg);
    color: var(--text);
}

.menu-links {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
}

.menu-link {
    font-family: var(--font-serif);
    font-size: 3rem;
    transition: color 0.4s, transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
    font-style: italic;
}

@media (min-width: 768px) {
    .menu-link { font-size: 5rem; }
}

.menu-link:hover {
    color: var(--text-muted);
    transform: translateX(20px);
}

.menu-divider {
    width: 60px;
    height: 1px;
    background-color: var(--border);
    margin: 2rem 0;
}

/* Toast */
.toast {
    position: fixed;
    bottom: calc(var(--mobile-nav-height) + 2rem);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 1rem 3rem;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    z-index: 2000;
    transition: opacity 0.6s, transform 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

@media (min-width: 768px) {
    .toast { bottom: 4rem; }
}

.toast.hidden {
    opacity: 0;
    transform: translate(-50%, 40px);
    pointer-events: none;
}

/* Video Detail */
.detail-hero {
    position: relative;
    width: 100vw;
    height: 60vh;
}

@media (min-width: 768px) {
    .detail-hero { height: 80vh; }
}

.detail-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 0%, black 50%, transparent 100%);
}

.detail-content {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 2rem;
    position: relative;
    margin-top: -8rem;
    z-index: 10;
}

@media (min-width: 768px) {
    .detail-content { padding: 0 5rem; margin-top: -12rem; }
}

.detail-title {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 2rem;
    letter-spacing: -0.02em;
}

@media (min-width: 768px) {
    .detail-title { font-size: 8rem; margin-bottom: 3rem; }
}

.detail-meta-row {
    display: flex;
    gap: 2rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4rem;
}

@media (min-width: 768px) {
    .detail-meta-row { margin-bottom: 6rem; }
}

.detail-actions {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    margin-bottom: 6rem;
    align-items: flex-start;
}

@media (min-width: 768px) {
    .detail-actions { flex-direction: row; align-items: center; margin-bottom: 10rem; }
}

.detail-watch-btn {
    display: inline-block;
    padding: 1.5rem 4rem;
    background-color: var(--text);
    color: var(--bg);
    font-family: var(--font-serif);
    font-size: 1.5rem;
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), background-color 0.4s;
    font-style: italic;
}

.detail-watch-btn:hover {
    background-color: var(--text-muted);
    transform: translateY(-5px);
}

.detail-fav-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid transparent;
    padding-bottom: 4px;
    transition: color 0.4s, border-color 0.4s;
}

.detail-fav-btn:hover {
    color: var(--text);
    border-color: var(--text);
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4rem;
    border-top: 1px solid var(--border);
    padding-top: 4rem;
    margin-bottom: 6rem;
}

@media (min-width: 768px) {
    .detail-grid { 
        grid-template-columns: repeat(3, 1fr); 
        gap: 6rem; 
        padding-top: 6rem; 
        margin-bottom: 10rem; 
    }
}

.detail-col h3 {
    font-family: var(--font-serif);
    font-size: 2rem;
    color: var(--text-muted);
    margin-bottom: 3rem;
    font-style: italic;
}

.detail-list {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.detail-item {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
}

.detail-item-label {
    color: var(--text);
    font-size: 0.95rem;
}

.detail-item-sub {
    color: var(--text-muted);
    font-size: 0.85rem;
}

/* Search Page */
.search-container {
    padding: 6rem 2rem 2rem;
    max-width: 1600px;
    margin: 0 auto;
}

@media (min-width: 768px) {
    .search-container { padding: 8rem 5rem 2rem; }
}

.search-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: 2.5rem;
    padding: 1rem 0;
    transition: border-color 0.4s;
}

@media (min-width: 768px) {
    .search-input { font-size: 4rem; }
}

.search-input:focus {
    outline: none;
    border-color: var(--text);
}

.search-input::placeholder {
    color: var(--border);
}

.search-results-meta {
    margin: 4rem 0;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
}

/* Empty State */
.empty-state {
    padding: 10rem 0;
    text-align: center;
}

.empty-state h2 {
    font-size: 3rem;
    margin-bottom: 2rem;
    color: var(--text-muted);
    font-style: italic;
}

.empty-state p {
    color: var(--text-muted);
    font-size: 0.95rem;
}

/* Player Placeholder */
.player-placeholder {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
}

.player-placeholder h1 {
    font-size: 4rem;
    margin-bottom: 2rem;
    font-style: italic;
}

.player-placeholder p {
    color: var(--text-muted);
    margin-bottom: 4rem;
    font-size: 0.95rem;
}

.btn-clear {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--text);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: opacity 0.4s;
}

.btn-clear:hover {
    opacity: 0.6;
}

/* Loading Screen */
.loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg);
    z-index: 99999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 1.5s cubic-bezier(0.65, 0, 0.05, 1);
}

.loader.finished {
    transform: translateY(-100%);
}

.loader-word {
    display: flex;
    font-family: var(--font-serif);
    font-size: 5rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
}

@media (min-width: 768px) {
    .loader-word { font-size: 10rem; }
}

.loader-char {
    position: relative;
    display: inline-flex;
    overflow: hidden;
    padding: 0 0.1rem;
}

.loader-char .char {
    opacity: 0;
}

.loader-char .block {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--text);
    transform: scaleX(0);
    transform-origin: left;
}

@keyframes blockIn {
    0% { transform: scaleX(0); transform-origin: left; }
    49.9% { transform: scaleX(1); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
}

@keyframes charReveal {
    0%, 49.9% { opacity: 0; }
    50%, 100% { opacity: 1; }
}

.loader:not(.finished) .loader-char .block {
    animation: blockIn 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
}

.loader:not(.finished) .loader-char .char {
    animation: charReveal 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
}

/* Stagger animation */
.loader-char:nth-child(1) .block, .loader-char:nth-child(1) .char { animation-delay: 0.2s; }
.loader-char:nth-child(2) .block, .loader-char:nth-child(2) .char { animation-delay: 0.35s; }
.loader-char:nth-child(3) .block, .loader-char:nth-child(3) .char { animation-delay: 0.5s; }
.loader-char:nth-child(4) .block, .loader-char:nth-child(4) .char { animation-delay: 0.65s; }
.loader-char:nth-child(5) .block, .loader-char:nth-child(5) .char { animation-delay: 0.8s; }


@keyframes charHide {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

.loader.hiding .loader-char .block {
    animation: blockIn 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards !important;
}

.loader.hiding .loader-char .char {
    animation: charHide 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards !important;
}

/* Forward stagger for hiding (W disappears first) */
.loader.hiding .loader-char:nth-child(1) .block, .loader.hiding .loader-char:nth-child(1) .char { animation-delay: 0s !important; }
.loader.hiding .loader-char:nth-child(2) .block, .loader.hiding .loader-char:nth-child(2) .char { animation-delay: 0.1s !important; }
.loader.hiding .loader-char:nth-child(3) .block, .loader.hiding .loader-char:nth-child(3) .char { animation-delay: 0.2s !important; }
.loader.hiding .loader-char:nth-child(4) .block, .loader.hiding .loader-char:nth-child(4) .char { animation-delay: 0.3s !important; }
.loader.hiding .loader-char:nth-child(5) .block, .loader.hiding .loader-char:nth-child(5) .char { animation-delay: 0.4s !important; }

/* ==========================================================================
   PHASE 4: VIDEO PLAYER
   ========================================================================== */

.watch-page {
    width: 100vw;
    min-height: 100vh;
    padding-top: 10px;
}

@media (min-width: 768px) {
    .watch-page {
        padding-top: 120px; /* 100px for nav + 20px space */
    }
}

.watch-player-wrapper {
    position: relative;
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
    aspect-ratio: 16 / 10;
    max-height: 85vh;
    user-select: none;
    -webkit-user-select: none;
}

@media (min-width: 768px) {
    .watch-player-wrapper {
        aspect-ratio: 16 / 10;
        height: auto;
        max-width: 1200px;
        margin: 0 auto;
    }
    
    .watch-player-wrapper.theater-mode {
        height: 80vh;
        max-width: 100%;
        margin: 0;
    }
}

.watch-player-wrapper.is-fullscreen {
    max-width: 100%;
    height: 100vh;
    margin: 0;
    border-radius: 0;
}

.watch-player-wrapper.controls-hidden {
    cursor: none;
}

.watch-player-wrapper.controls-hidden .player-overlay {
    opacity: 0;
}

.watch-player-wrapper.controls-hidden .player-top-bar,
.watch-player-wrapper.controls-hidden .player-bottom-bar,
.watch-player-wrapper.controls-hidden .player-center-action {
    pointer-events: none;
}

#videoElement {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Hide native subtitles (WebVTT) as HLS.js or native will handle it. Wait, native subtitles show up automatically if track is enabled. */

.player-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.8) 100%);
    transition: opacity 0.5s cubic-bezier(0.2, 1, 0.3, 1);
    z-index: 10;
}

.player-top-bar {
    padding: 1.5rem 2rem;
    display: flex;
    visibility: hidden;
    pointer-events: none;
    align-items: center;
    gap: 1.5rem;
}

.watch-player-wrapper.is-fullscreen .player-top-bar {
    visibility: visible;
    pointer-events: auto;
}

.player-title {
    font-size: 1.5rem;
    color: var(--text);
    font-style: italic;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-center-action {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    color: var(--text);
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: transform 0.3s, background 0.3s;
    border-radius: 50%;
}

.player-center-action:hover {
    background: rgba(0,0,0,0.6);
    transform: translate(-50%, -50%) scale(1.05);
}

.player-center-action svg {
    width: 40px;
    height: 40px;
}

.player-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
    border-radius: 50% !important; /* Force rounded here */
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.player-bottom-bar {
    padding: 1rem 2rem 2.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

/* Progress */
.player-progress-container {
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
}

.player-progress-bar {
    position: relative;
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.2);
    transition: height 0.2s;
}

.player-progress-container:hover .player-progress-bar {
    height: 5px;
}

.player-progress-loaded {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: rgba(255,255,255,0.4);
}

.player-progress-played {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--accent);
}

.player-progress-scrubber {
    position: absolute;
    top: 50%;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50% !important;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.2s;
}

.player-progress-container:hover .player-progress-scrubber {
    opacity: 1;
}

.player-progress-tooltip {
    position: absolute;
    top: -30px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 4px 8px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.1);
}

/* Controls */
.player-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.player-controls-left, .player-controls-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
}

.player-icon-btn {
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    opacity: 0.8;
    transition: opacity 0.2s, transform 0.2s;
}

.player-icon-btn:hover {
    opacity: 1;
    transform: scale(1.1);
}

.player-icon-btn svg {
    width: 20px;
    height: 20px;
}

.player-text-btn {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.8;
    transition: opacity 0.2s;
}

.player-text-btn:hover {
    opacity: 1;
}

.player-time {
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    color: var(--text);
}

.player-volume-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.player-volume-slider {
    width: 0;
    opacity: 0;
    transition: width 0.3s, opacity 0.3s;
    -webkit-appearance: none;
    background: transparent;
}

.player-volume-group:hover .player-volume-slider,
.player-volume-slider:focus {
    width: 80px;
    opacity: 1;
}

.player-volume-slider::-webkit-slider-runnable-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.2);
}

.player-volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 12px;
    width: 12px;
    background: #fff;
    margin-top: -4.5px;
    cursor: pointer;
}

/* Menus */
.player-menu {
    position: absolute;
    bottom: 80px;
    right: 2rem;
    width: 300px;
    background: rgba(10, 10, 10, 0.95);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 20;
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.4s ease, visibility 0.4s;
    transform: translateY(0) scale(1);
    transform-origin: bottom center;
    display: flex;
    flex-direction: column;
}

.player-menu.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(10px) scale(0.98);
}

.player-menu-header {
    display: flex;
    align-items: center;
    padding: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.player-menu-header span {
    flex-grow: 1;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
}

.player-menu-content {
    max-height: 300px;
    overflow-y: auto;
}

.menu-list {
    display: flex;
    flex-direction: column;
    padding: 0.5rem 0;
}

.menu-list-item {
    display: flex;
    align-items: center;
    padding: 0.75rem 1.5rem;
    font-size: 0.9rem;
    text-align: left;
    transition: background 0.2s;
    color: var(--text);
}

.menu-list-item:hover, .menu-list-item.active {
    background: rgba(255,255,255,0.1);
}

.menu-list-item.active {
    color: var(--accent);
}

.menu-check {
    width: 20px;
    margin-right: 10px;
    font-size: 0.8rem;
}

.menu-value {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 0.85rem;
}

/* Resume Prompt */
.resume-prompt {
    position: absolute;
    bottom: 6rem;
    left: 2rem;
    background: rgba(10,10,10,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 2rem;
    z-index: 20;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.resume-header {
    font-size: 1.5rem;
    font-style: italic;
    margin-bottom: 0.5rem;
}

.resume-meta {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
}

.resume-actions {
    display: flex;
    gap: 1.5rem;
}

.resume-btn {
    font-size: 0.8rem;
    letter-spacing: 0.1em;

    <script>const formatTime = (seconds) => {
    if (isNaN(seconds)) return '00:00';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
};

    bindElements() {
        this.els = {
            wrapper: document.getElementById('playerWrapper'),

            progressLoaded: document.getElementById('progressLoaded'),

            progressTooltip: document.getElementById('progressTooltip'),

            volHigh: document.querySelector('.vol-high'),
            volMuted: document.querySelector('.vol-muted'),
            volumeSlider: document.getElementById('volumeSlider'),

            resumeMeta: document.getElementById('resumeMeta'),
            resumeBtn: document.getElementById('resumeBtn'),
            startOverBtn: document.getElementById('startOverBtn'),
            seekIndicator: document.getElementById('seekIndicator'),
            backBtn: document.getElementById('playerBackBtn')
        };
        
        // Apply object fit
        this.els.video.style.objectFit = this.state.objectFit;
        
        // Hide PIP if not supported
        if (!document.pictureInPictureEnabled) {
            this.els.pipBtn.style.display = 'none';
        }
        
        // Mobile hides theater
        if (window.innerWidth < 768) {
            this.els.theaterBtn.style.display = 'none';
        }
    }
    
    async initPlayer() {
        if (!this.playbackData) {
            try {
                const response = await fetch(`${this.apiUrl}/videos/${this.videoData.id}/playback`);
                if (!response.ok) throw new Error('Playback info not available');
                this.playbackData = await response.json();
            } catch (e) {
                console.error(e);
                return;
            }
        }

        let sourceUrl = this.playbackData.source.url;
        if (!sourceUrl.startsWith('http')) {
            sourceUrl = this.apiUrl.replace('/api', '') + sourceUrl;
        }

        // Add subtitle tracks to video element manually (WebVTT)
        if (this.playbackData.subtitle_tracks && this.playbackData.subtitle_tracks.length > 0) {
            this.state.subtitleTracks = this.playbackData.subtitle_tracks.map(t => ({
                id: t.id,
                name: t.label,
                language: t.language,
                url: t.url.startsWith('http') ? t.url : this.apiUrl.replace('/api', '') + t.url,
                default: t.default
            }));
            
            this.state.subtitleTracks.forEach((t, i) => {
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.label = t.name;
                track.srclang = t.language || 'en';
                track.src = t.url;
                if (t.default || (this.state.subtitlesEnabled && this.state.selectedSubtitleTrack === -1 && i === 0)) {
                    track.default = true;
                    this.state.selectedSubtitleTrack = t.id;
                }
                this.els.video.appendChild(track);
            });
            this.els.captionBtn.classList.remove('hidden');
        }

        // Apply initial states
        this.els.video.volume = this.state.volume;
        this.els.video.muted = this.state.muted;
        this.els.video.playbackRate = this.state.playbackRate;
        this.updateVolumeUI();
        
        if (this.playbackData.mode === 'hls' && typeof Hls !== 'undefined' && Hls.isSupported()) {
            this.hls = new Hls({
                autoStartLoad: true,
                startPosition: -1,
                capLevelToPlayerSize: true,
            });
            
            this.hls.loadSource(sourceUrl);
            this.hls.attachMedia(this.els.video);
            
            // Pre-populate audio tracks from backend metadata to guarantee they show up
            if (this.playbackData.audio_tracks && this.playbackData.audio_tracks.length > 1) {
                this.state.audioTracks = this.playbackData.audio_tracks.map((t, index) => ({
                    id: index,
                    name: t.label || t.language || `Track ${index+1}`
                }));
                this.els.audioBtn.classList.remove('hidden');
                this.state.selectedAudioTrack = 0;
            }

            this.hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                // If hls.js parsed its own tracks, we can optionally sync with them
                if (this.hls.audioTracks && this.hls.audioTracks.length > 1) {
                    this.state.audioTracks = this.hls.audioTracks;
                    this.els.audioBtn.classList.remove('hidden');
                }
                this.state.selectedAudioTrack = this.hls.audioTrack;
            });
            
            this.hls.on(Hls.Events.AUDIO_TRACK_LOADED, (event, data) => {
                this.state.selectedAudioTrack = data.id;
            });
            
            this.hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, (event, data) => {
                this.state.selectedAudioTrack = data.id;
            });
            
            this.hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            this.hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            this.hls.recoverMediaError();
                            break;
                        default:
                            this.hls.destroy();
                            break;
                    }
                }
            });
        } else if (this.els.video.canPlayType('application/vnd.apple.mpegurl')) {
            // Direct mp4 or Native Safari HLS
            this.els.video.src = sourceUrl;
            
            // Audio tracks natively supported by Safari via video.audioTracks
            if (this.playbackData.audio_tracks && this.playbackData.audio_tracks.length > 1) {
                this.state.audioTracks = this.playbackData.audio_tracks.map((t, index) => ({
                    id: index, // Safari native tracks are 0-indexed
                    name: t.label || t.language || `Track ${index+1}`
                }));
                this.els.audioBtn.classList.remove('hidden');
                this.state.selectedAudioTrack = 0;
                
                this.els.video.addEventListener('loadedmetadata', () => {
                    if (this.els.video.audioTracks) {
                        for (let i = 0; i < this.els.video.audioTracks.length; i++) {
                            if (this.els.video.audioTracks[i].enabled) {
                                this.state.selectedAudioTrack = i;
                            }
                        }
                    }
                });
            }
        }
    }
    
    attachEvents() {
        const { video, wrapper, overlay, progressContainer, volumeSlider } = this.els;
        
        // Video Events
        video.addEventListener('play', () => {
            this.state.playing = true;
            this.els.playIcon.classList.add('hidden');
            this.els.pauseIcon.classList.remove('hidden');
            this.els.centerPlayBtn.classList.add('hidden');
            this.els.resumePrompt.classList.add('hidden');
            this.startControlsHideTimer();
        });
        
        video.addEventListener('pause', () => {
            this.state.playing = false;
            this.els.playIcon.classList.remove('hidden');
            this.els.pauseIcon.classList.add('hidden');
            this.els.centerPlayBtn.classList.remove('hidden');
            this.showControls();
            clearTimeout(this.state.controlsTimeout);
        });
        
        video.addEventListener('timeupdate', () => {
            if (!this.state.isSeeking) {
                this.updateProgress();
            }
            this.saveProgress();
        });
        
        video.addEventListener('durationchange', () => {
            this.state.duration = video.duration;
            this.updateProgress();
        });
        
        video.addEventListener('progress', () => {
            if (video.buffered.length > 0) {
                const loaded = video.buffered.end(video.buffered.length - 1);
                const percent = (loaded / this.state.duration) * 100;
                this.els.progressLoaded.style.width = `${percent}%`;
            }
        });
        
        video.addEventListener('waiting', () => {
            this.state.isBuffering = true;
            this.els.loading.classList.remove('hidden');
        });
        
        video.addEventListener('playing', () => {
            this.state.isBuffering = false;
            this.els.loading.classList.add('hidden');
        });

        // Overlay Interactions (Desktop vs Mobile)
        overlay.addEventListener('mousemove', () => {
            this.showControls();
            if (this.state.playing) this.startControlsHideTimer();
        });
        
        overlay.addEventListener('mouseleave', () => {
            if (this.state.playing && !this.state.activeMenu) {
                this.hideControls();
            }
        });
        
        overlay.addEventListener('click', (e) => {
            // If clicking directly on the overlay (the video area), toggle play/pause
            if (e.target === overlay || e.target === this.els.centerPlayBtn) {
                if (window.innerWidth < 768) {
                    // Mobile behavior: first tap shows controls, second taps inside play/pause
                    if (!this.state.controlsVisible) {
                        this.showControls();
                        this.startControlsHideTimer();
                    } else {
                        this.togglePlay();
                    }
                } else {
                    // Desktop behavior: always toggle
                    this.togglePlay();
                }
            }
        });

        // Double tap to seek (mobile)
        let lastTap = 0;
        overlay.addEventListener('touchstart', (e) => {
            if (e.target !== overlay) return;
            const now = Date.now();
            if (now - lastTap < 300) {
                const x = e.changedTouches[0].clientX;
                const width = window.innerWidth;
                if (x < width / 2) {
                    this.seekRelative(-10);
                    this.showSeekIndicator('backward');
                } else {
                    this.seekRelative(10);
                    this.showSeekIndicator('forward');
                }
            }
            lastTap = now;
        }, { passive: true });

        // Controls
        this.els.playPauseBtn.addEventListener('click', () => this.togglePlay());
        this.els.muteBtn.addEventListener('click', () => this.toggleMute());
        
        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            video.volume = val;
            video.muted = val === 0;
            this.state.volume = val;
            this.state.muted = val === 0;
            this.updateVolumeUI();
            localStorage.setItem('watch_volume', val.toString());
            localStorage.setItem('watch_muted', this.state.muted.toString());
        });
        
        this.els.fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());
        this.els.theaterBtn.addEventListener('click', () => this.toggleTheater());
        this.els.pipBtn.addEventListener('click', async () => {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                await video.requestPictureInPicture();
            }
        });
        
        this.els.backBtn.addEventListener('click', () => {
            window.history.back();
        });

        // Progress Bar
        const updateSeek = (e) => {
            const rect = progressContainer.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            const newTime = pos * this.state.duration;
            this.els.progressPlayed.style.width = `${pos * 100}%`;
            this.els.progressScrubber.style.left = `${pos * 100}%`;
            this.els.timeDisplay.textContent = `${formatTime(newTime)} / ${formatTime(this.state.duration)}`;
            return newTime;
        };

        progressContainer.addEventListener('mousedown', (e) => {
            this.state.isSeeking = true;
            updateSeek(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (this.state.isSeeking) {
                updateSeek(e);
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (this.state.isSeeking) {
                this.state.isSeeking = false;
                video.currentTime = updateSeek(e);
            }
        });

        progressContainer.addEventListener('mousemove', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            const time = pos * this.state.duration;
            this.els.progressTooltip.textContent = formatTime(time);
            this.els.progressTooltip.style.left = `${pos * 100}%`;
            this.els.progressTooltip.classList.remove('hidden');
        });

        progressContainer.addEventListener('mouseleave', () => {
            this.els.progressTooltip.classList.add('hidden');
        });
        
        // Touch seeking
        progressContainer.addEventListener('touchstart', (e) => {
            this.state.isSeeking = true;
            updateSeek(e.touches[0]);
        }, { passive: true });
        
        progressContainer.addEventListener('touchmove', (e) => {
            if (this.state.isSeeking) updateSeek(e.touches[0]);
        }, { passive: true });
        
        progressContainer.addEventListener('touchend', (e) => {
            if (this.state.isSeeking) {
                this.state.isSeeking = false;
                video.currentTime = updateSeek(e.changedTouches[0]);
            }
        });

        // Menus
        this.els.settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.openMenu('settings');
        });
        
        this.els.audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.openMenu('audio');
        });
        
        this.els.captionBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.openMenu('captions');
        });
        
        this.els.menuCloseBtn.addEventListener('click', () => this.closeMenu());
        this.els.menuBackBtn.addEventListener('click', () => this.openMenu('settings'));
        
        // Keyboard
        this.handleKeydown = this.handleKeydown.bind(this);
        document.addEventListener('keydown', this.handleKeydown);
        
        // Fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                this.els.fsEnter.classList.add('hidden');
                this.els.fsExit.classList.remove('hidden');
                wrapper.classList.add('is-fullscreen');
            } else {
                this.els.fsEnter.classList.remove('hidden');
                this.els.fsExit.classList.add('hidden');
                wrapper.classList.remove('is-fullscreen');
            }
        });
        
        // Media Session API
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: this.videoData.title,
                artist: 'Watch Archive',
                artwork: [
                    { src: this.videoData.poster || this.videoData.thumbnail, sizes: '500x750', type: 'image/jpeg' }
                ]
            });
            navigator.mediaSession.setActionHandler('play', () => this.els.video.play());
            navigator.mediaSession.setActionHandler('pause', () => this.els.video.pause());
            navigator.mediaSession.setActionHandler('seekbackward', () => this.seekRelative(-10));
            navigator.mediaSession.setActionHandler('seekforward', () => this.seekRelative(10));
        }
    }
    
    handleKeydown(e) {
        if (e.target.tagName.toLowerCase() === 'input') return;
        
        switch(e.key.toLowerCase()) {
            case ' ':
            case 'k':
                e.preventDefault();
                this.togglePlay();
                this.showControls();
                if(this.state.playing) this.startControlsHideTimer();
                break;
            case 'arrowright':
                e.preventDefault();
                this.seekRelative(10);
                this.showControls();
                break;
            case 'arrowleft':
                e.preventDefault();
                this.seekRelative(-10);
                this.showControls();
                break;
            case 'arrowup':
                e.preventDefault();
                this.els.video.volume = Math.min(1, this.els.video.volume + 0.1);
                this.updateVolumeStateFromVideo();
                this.showControls();
                break;
            case 'arrowdown':
                e.preventDefault();
                this.els.video.volume = Math.max(0, this.els.video.volume - 0.1);
                this.updateVolumeStateFromVideo();
                this.showControls();
                break;
            case 'm':
                e.preventDefault();
                this.toggleMute();
                this.showControls();
                break;
            case 'f':
                e.preventDefault();
                this.toggleFullscreen();
                break;
            case 'c':
                e.preventDefault();
                this.toggleCaptions();
                break;
            case 'escape':
                if (this.state.activeMenu) this.closeMenu();
                break;
        }
    }

    updateVolumeStateFromVideo() {
        this.state.volume = this.els.video.volume;
        this.state.muted = this.els.video.muted || this.state.volume === 0;
        this.els.volumeSlider.value = this.state.volume;
        this.updateVolumeUI();
        localStorage.setItem('watch_volume', this.state.volume.toString());
        localStorage.setItem('watch_muted', this.state.muted.toString());
    }
    
    togglePlay() {
        if (this.els.video.paused) {
            this.els.video.play();
        } else {
            this.els.video.pause();
        }
    }
    
    toggleMute() {
        this.els.video.muted = !this.els.video.muted;
        this.state.muted = this.els.video.muted;
        if (!this.state.muted && this.state.volume === 0) {
            this.els.video.volume = 0.5;
            this.state.volume = 0.5;
            this.els.volumeSlider.value = 0.5;
        }
        this.updateVolumeUI();
        localStorage.setItem('watch_muted', this.state.muted.toString());
        localStorage.setItem('watch_volume', this.state.volume.toString());
    }
    
    updateVolumeUI() {
        if (this.state.muted || this.state.volume === 0) {
            this.els.volHigh.classList.add('hidden');
            this.els.volMuted.classList.remove('hidden');
        } else {
            this.els.volHigh.classList.remove('hidden');
            this.els.volMuted.classList.add('hidden');
        }
    }
    
    seekRelative(seconds) {
        this.els.video.currentTime = Math.max(0, Math.min(this.state.duration, this.els.video.currentTime + seconds));
    }
    
    showSeekIndicator(direction) {
        this.els.seekIndicator.textContent = direction === 'forward' ? '10 ↷' : '↶ 10';
        this.els.seekIndicator.classList.remove('hidden');
        this.els.seekIndicator.style.animation = 'none';
        this.els.seekIndicator.offsetHeight; // trigger reflow
        this.els.seekIndicator.style.animation = 'popFade 0.6s ease forwards';
    }
    
    toggleFullscreen() {
        if (!document.fullscreenElement) {
            this.els.wrapper.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    toggleTheater() {
        this.state.theaterMode = !this.state.theaterMode;
        if (this.state.theaterMode) {
            this.els.wrapper.classList.add('theater-mode');
        } else {
            this.els.wrapper.classList.remove('theater-mode');
        }
        localStorage.setItem('watch_theater', this.state.theaterMode.toString());
    }
    
    updateProgress() {
        const current = this.els.video.currentTime;
        const dur = this.state.duration || this.els.video.duration || 0;
        if (dur === 0) return;
        
        const percent = (current / dur) * 100;
        this.els.progressPlayed.style.width = `${percent}%`;
        this.els.progressScrubber.style.left = `${percent}%`;
        
        this.els.timeDisplay.textContent = `${formatTime(current)} / ${formatTime(dur)}`;
    }
    
    showControls() {
        this.state.controlsVisible = true;
        this.els.wrapper.classList.remove('controls-hidden');
    }
    
    hideControls() {
        this.state.controlsVisible = false;
        this.els.wrapper.classList.add('controls-hidden');
    }
    
    startControlsHideTimer() {
        clearTimeout(this.state.controlsTimeout);
        if (this.state.activeMenu) return; // Don't hide if menu is open
        this.state.controlsTimeout = setTimeout(() => {
            if (this.state.playing) {
                this.hideControls();
            }
        }, 3000);
    }
    
    // Resume functionality
    checkResume() {
        const progressRaw = localStorage.getItem(`watch_progress_${this.videoData.id}`);
        if (progressRaw) {
            try {
                const data = JSON.parse(progressRaw);
                // If less than 95% complete and more than 10s watched
                if (data.currentTime > 10 && (data.currentTime / data.duration) < 0.95) {
                    this.showResumePrompt(data.currentTime);
                }
            } catch (e) {}
        }
    }
    
    showResumePrompt(time) {
        this.els.resumeMeta.textContent = `${formatTime(this.state.duration - time)} remaining from last session`;
        this.els.resumePrompt.classList.remove('hidden');
        
        this.els.resumeBtn.onclick = () => {
            this.els.video.currentTime = time;
            this.els.video.play();
            this.els.resumePrompt.classList.add('hidden');
        };
        
        this.els.startOverBtn.onclick = () => {
            this.els.video.currentTime = 0;
            this.els.video.play();
            this.els.resumePrompt.classList.add('hidden');
        };
    }
    
    saveProgress() {
        // Throttle saving to every 5 seconds or so
        const now = Date.now();
        if (!this._lastSave || now - this._lastSave > 5000) {
            const current = this.els.video.currentTime;
            const dur = this.state.duration;
            if (dur > 0 && current > 0) {
                localStorage.setItem(`watch_progress_${this.videoData.id}`, JSON.stringify({
                    currentTime: current,
                    duration: dur,
                    updatedAt: now
                }));
                this._lastSave = now;
            }
        }
    }
    
    // Menus
    openMenu(type) {
        this.state.activeMenu = type;
        this.showControls();
        clearTimeout(this.state.controlsTimeout);
        
        if (type === 'settings') {
            this.els.menuTitle.textContent = 'Settings';
            this.els.menuBackBtn.classList.add('hidden');
            this.renderSettingsMenu();
        } else if (type === 'audio') {
            this.els.menuTitle.textContent = 'Audio';
            this.els.menuBackBtn.classList.remove('hidden');
            this.renderAudioMenu();
        } else if (type === 'captions') {
            this.els.menuTitle.textContent = 'Subtitles';
            this.els.menuBackBtn.classList.remove('hidden');
            this.renderCaptionMenu();
        } else if (type === 'speed') {
            this.els.menuTitle.textContent = 'Playback Speed';
            this.els.menuBackBtn.classList.remove('hidden');
            this.renderSpeedMenu();
        }

        if (this.els.menu.classList.contains('hidden')) {
            // Force browser layout reflow to ensure the transition fires from the initial state
            void this.els.menu.offsetWidth;
            this.els.menu.classList.remove('hidden');
        }
    }
    
    closeMenu() {
        this.state.activeMenu = null;
        this.els.menu.classList.add('hidden');
        if (this.state.playing) this.startControlsHideTimer();
    }
    
    renderSettingsMenu() {
        let html = `
            <div class="menu-list">
                <button class="menu-list-item" onclick="window.playerInstance.openMenu('speed')">
                    <span>Playback Speed</span>
                    <span class="menu-value">${this.state.playbackRate}×</span>
                </button>
        `;
        
        if (this.state.audioTracks.length > 0) {
            let activeAudio = this.state.audioTracks.find(t => t.id === this.state.selectedAudioTrack);
            html += `
                <button class="menu-list-item" onclick="window.playerInstance.openMenu('audio')">
                    <span>Audio</span>
                    <span class="menu-value">${activeAudio ? (activeAudio.name || activeAudio.language) : 'Default'}</span>
                </button>
            `;
        }
        
        if (this.state.subtitleTracks.length > 0) {
            let activeSub = this.state.subtitleTracks.find(t => t.id === this.state.selectedSubtitleTrack);
            let subText = this.state.subtitlesEnabled && activeSub ? (activeSub.name || activeSub.language) : 'Off';
            html += `
                <button class="menu-list-item" onclick="window.playerInstance.openMenu('captions')">
                    <span>Subtitles</span>
                    <span class="menu-value">${subText}</span>
                </button>
            `;
        }
        
        let fitText = this.state.objectFit === 'contain' ? 'Fit' : (this.state.objectFit === 'cover' ? 'Crop' : 'Stretch');
        html += `
            <button class="menu-list-item" onclick="window.playerInstance.toggleVideoFit()">
                <span>Video Fit</span>
                <span class="menu-value">${fitText}</span>
            </button>
        </div>`;
        this.els.menuContent.innerHTML = html;
    }
    
    renderAudioMenu() {
        let html = `<div class="menu-list">`;
        this.state.audioTracks.forEach(track => {
            const isActive = this.state.selectedAudioTrack === track.id;
            html += `
                <button class="menu-list-item ${isActive ? 'active' : ''}" onclick="window.playerInstance.setAudioTrack(${track.id})">
                    <span class="menu-check">${isActive ? '●' : ''}</span>
                    <span>${track.name || track.language || `Track ${track.id}`}</span>
                </button>
            `;
        });
        html += `</div>`;
        this.els.menuContent.innerHTML = html;
    }
    
    setAudioTrack(id) {
        if (this.hls) {
            this.hls.audioTrack = id;
            this.state.selectedAudioTrack = id;
            this.openMenu('settings'); // Go back
        } else if (this.els.video.audioTracks) {
            for (let i = 0; i < this.els.video.audioTracks.length; i++) {
                this.els.video.audioTracks[i].enabled = (i === id);
            }
            this.state.selectedAudioTrack = id;
            this.openMenu('settings');
        }
    }

    renderCaptionMenu() {
        let html = `<div class="menu-list">
            <button class="menu-list-item ${!this.state.subtitlesEnabled ? 'active' : ''}" onclick="window.playerInstance.setCaptionTrack(-1)">
                <span class="menu-check">${!this.state.subtitlesEnabled ? '●' : ''}</span>
                <span>Off</span>
            </button>
        `;
        this.state.subtitleTracks.forEach(track => {
            const isActive = this.state.subtitlesEnabled && this.state.selectedSubtitleTrack === track.id;
            html += `
                <button class="menu-list-item ${isActive ? 'active' : ''}" onclick="window.playerInstance.setCaptionTrack('${track.id}')">
                    <span class="menu-check">${isActive ? '●' : ''}</span>
                    <span>${track.name || track.language || `Track ${track.id}`}</span>
                </button>
            `;
        });
        html += `</div>`;
        this.els.menuContent.innerHTML = html;
    }
    
    setCaptionTrack(id) {
        if (id === -1) {
            this.state.subtitlesEnabled = false;
        } else {
            this.state.selectedSubtitleTrack = id;
            this.state.subtitlesEnabled = true;
        }
        localStorage.setItem('watch_subtitles', this.state.subtitlesEnabled.toString());
        this.applySubtitles();
        this.openMenu('settings');
    }
    
    applySubtitles() {
        const textTracks = this.els.video.textTracks;
        for (let i = 0; i < textTracks.length; i++) {
            const track = textTracks[i];
            const matchingDataTrack = this.state.subtitleTracks[i];
            if (this.state.subtitlesEnabled && matchingDataTrack && matchingDataTrack.id === this.state.selectedSubtitleTrack) {
                track.mode = 'showing';
            } else {
                track.mode = 'hidden';
            }
        }
    }
    
    toggleCaptions() {
        this.state.subtitlesEnabled = !this.state.subtitlesEnabled;
        if (this.state.subtitlesEnabled && this.state.subtitleTracks.length > 0) {
            if (this.state.selectedSubtitleTrack === -1) {
                this.state.selectedSubtitleTrack = this.state.subtitleTracks[0].id;
            }
        }
        localStorage.setItem('watch_subtitles', this.state.subtitlesEnabled.toString());
        this.applySubtitles();
    }
    
    renderSpeedMenu() {
        const speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
        let html = `<div class="menu-list">`;
        speeds.forEach(speed => {
            const isActive = this.state.playbackRate === speed;
            html += `
                <button class="menu-list-item ${isActive ? 'active' : ''}" onclick="window.playerInstance.setSpeed(${speed})">
                    <span class="menu-check">${isActive ? '●' : ''}</span>
                    <span>${speed}×</span>
                </button>
            `;
        });
        html += `</div>`;
        this.els.menuContent.innerHTML = html;
    }
    
    setSpeed(speed) {
        this.els.video.playbackRate = speed;
        this.state.playbackRate = speed;
        localStorage.setItem('watch_speed', speed.toString());
        this.openMenu('settings');
    }

    toggleVideoFit() {
        const fits = ['contain', 'cover', 'fill'];
        let idx = fits.indexOf(this.state.objectFit);
        idx = (idx + 1) % fits.length;
        this.state.objectFit = fits[idx];
        this.els.video.style.objectFit = this.state.objectFit;
        localStorage.setItem('watch_objectFit', this.state.objectFit);
        this.renderSettingsMenu(); // Update UI text
    }
    
    destroy() {
        document.removeEventListener('keydown', this.handleKeydown);
        if (this.hls) {
            this.hls.destroy();
        }
        delete window.playerInstance;
    }
}




const API_URL = 'https://watch-backend.lucidfr.site/api';
// Production ready fallback: const API_URL = 'https://watch-backend.lucidfr.site/api';

const state = {
    videos: [],
    searchResults: [],
    searchQuery: '',
    favorites: JSON.parse(localStorage.getItem('watch_favorites')) || [],
    currentRoute: '/',
    heroIndex: 0,
    heroTimer: null
};

// DOM Elements
const elements = {
    app: document.getElementById('app'),
    navLinks: document.querySelectorAll('.nav-link'),
    menuOverlay: document.getElementById('menuOverlay'),
    menuBtn: document.getElementById('menuBtn'),
    mobileMenuBtn: document.getElementById('mobileMenuBtn'),
    closeMenuBtn: document.getElementById('closeMenuBtn'),
    toast: document.getElementById('toast'),
    refreshBtns: [document.getElementById('refreshBtn'), document.getElementById('menuRefreshBtn')]
};

// Format Utilities
const formatDuration = (seconds) => {
    if (!seconds) return '';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (h > 0) return `${h}H ${m}M`;
    return `${m}M`;
};

const formatRes = (w, h) => {
    if (!w || !h) return '';
    if (w >= 3800) return '4K';
    if (w >= 1900) return '1080P';
    if (w >= 1200) return '720P';
    return 'SD';
};

const getThumbnail = (id) => `${API_URL}/videos/${id}/thumbnail`;

// API Calls
async function fetchVideos(search = '') {
    try {
        const res = await fetch(`${API_URL}/videos?limit=100${search ? `&search=${encodeURIComponent(search)}` : ''}`);
        if (!res.ok) throw new Error('Failed to fetch');
        return await res.json();
    } catch (err) {
        console.error(err);
        return { items: [] };
    }
}

async function fetchVideoDetails(id) {
    try {
        const res = await fetch(`${API_URL}/videos/${id}`);
        if (!res.ok) throw new Error('Failed to fetch video');
        return await res.json();
    } catch (err) {
        console.error(err);
        return null;
    }
}

async function triggerRefresh() {
    try {
        showToast('REFRESHING ARCHIVE<br><small>Scanning media...</small>');
        const res = await fetch(`${API_URL}/refresh`, { method: 'POST' });
        const data = await res.json();
        
        const checkStatus = async () => {
            const statusRes = await fetch(`${API_URL}/refresh/status`);
            const statusData = await statusRes.json();
            if (statusData.status === 'running') {
                setTimeout(checkStatus, 2000);
            } else {
                showToast(`ARCHIVE UPDATED<br><small>Found ${statusData.last_scan?.new || 0} new files.</small>`);
                init(); // Reload
            }
        };
        checkStatus();
    } catch (err) {
        showToast('ERROR<br><small>Could not reach archive.</small>');
    }
}

// Router
function parseRoute() {
    let hash = window.location.hash || '#/';
    let route = hash.slice(1).split('?')[0];
    let params = new URLSearchParams(hash.split('?')[1] || '');
    return { route, params };
}

async function navigate() {
    const { route, params } = parseRoute();
    state.currentRoute = route;
    
    // Update active nav links
    elements.navLinks.forEach(link => {
        if (link.dataset.route === route) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });

    elements.app.classList.add('navigating');
    
    // Wait for fade out
    await new Promise(r => setTimeout(r, 400));
    
    if (state.heroTimer) {
        clearInterval(state.heroTimer);
    }
    
    // Cleanup old player
    if (window.playerInstance) {
        window.playerInstance.destroy();
    }
    
    window.scrollTo(0, 0);

    if (route === '/') {
        await renderHome();
    } else if (route === '/library') {
        await renderLibrary();
    } else if (route === '/search') {
        await renderSearch(params.get('q') || '');
    } else if (route.startsWith('/video/')) {
        const id = route.split('/')[2];
        await renderVideoDetail(id);
    } else if (route === '/stream') {
        const url = params.get('url');
        await renderStream(url);
    } else if (route.startsWith('/watch/')) {
        const id = route.split('/')[2];
        await renderWatch(id);
    } else {
        await renderHome();
    }

    elements.app.classList.remove('navigating');
}

// Views
async function renderHome() {
    if (state.videos.length === 0) {
        const data = await fetchVideos();
        state.videos = data.items || [];
    }

    if (state.videos.length === 0) {
        elements.app.innerHTML = `
            <div class="empty-state">
                <h2 class="serif">Archive empty</h2>
                <p>No cinematic media discovered.</p>
            </div>
        `;
        return;
    }

    const heroVideos = state.videos.slice(0, 5); // Cycle top 5
    
    elements.app.innerHTML = `
        <div class="hero">
            <div class="hero-images" id="heroImages">
                ${heroVideos.map((v, i) => `
                    <img src="${v.backdrop || v.thumbnail || getThumbnail(v.id)}" class="hero-img ${i === 0 ? 'active' : ''}" data-index="${i}" alt="${v.title}">
                `).join('')}
            </div>
            <div class="hero-content" id="heroContent">
                <div class="hero-title-container">
                    ${heroVideos.map((v, i) => `
                        <div class="hero-title serif ${i === 0 ? 'active' : ''}" data-index="${i}">${v.title}</div>
                    `).join('')}
                </div>
                <div class="hero-meta-container">
                    ${heroVideos.map((v, i) => {
                        const meta = [v.year, ...(v.genres || [])].filter(Boolean).join(' · ');
                        return `<div class="hero-meta ${i === 0 ? 'active' : ''}" data-index="${i}">${meta}</div>`;
                    }).join('')}
                </div>
                <a href="#/watch/${heroVideos[0].id}" class="watch-btn" id="heroWatchBtn">Watch &rarr;</a>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">Recently added</div>
            <div class="video-grid">
                ${state.videos.slice(0, 6).map(v => createVideoCard(v)).join('')}
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">From the archive</div>
            <div class="video-grid">
                ${state.videos.slice(6, 12).map(v => createVideoCard(v)).join('')}
            </div>
        </div>
    `;

    // Setup hero crossfade
    if (heroVideos.length > 1) {
        state.heroIndex = 0;
        state.heroTimer = setInterval(() => {
            const nextIndex = (state.heroIndex + 1) % heroVideos.length;
            
            // Images
            document.querySelectorAll('.hero-img').forEach(img => img.classList.remove('active'));
            document.querySelector(`.hero-img[data-index="${nextIndex}"]`).classList.add('active');
            
            // Titles
            document.querySelectorAll('.hero-title').forEach(title => title.classList.remove('active'));
            document.querySelector(`.hero-title[data-index="${nextIndex}"]`).classList.add('active');
            
            // Meta
            document.querySelectorAll('.hero-meta').forEach(meta => meta.classList.remove('active'));
            const nextMeta = document.querySelector(`.hero-meta[data-index="${nextIndex}"]`);
            if (nextMeta) nextMeta.classList.add('active');
            
            // Update button link
            document.getElementById('heroWatchBtn').href = `#/watch/${heroVideos[nextIndex].id}`;
            
            state.heroIndex = nextIndex;
        }, 6000);
    }
}
